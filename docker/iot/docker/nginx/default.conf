server {
        listen       80;
        server_name  0.0.0.0;
        location / {
                 add_header  Access-Control-Allow-Credentials true;
                 add_header  Access-Control-Max-Age 864000;
                 add_header X-Content-Type-Options: nosniff;
                 add_header X-XSS-Protection "1; mode=block";
                 add_header X-Permitted-Cross-Domain-Policies  none;
                 add_header  Content-Security-Policy  "manifest-src 'self'";
                 add_header X-Download-Options "noopen";
                 chunked_transfer_encoding  off;
                 gzip  on;
                 gzip_vary               on;
                 gzip_min_length         1024;
                 gzip_buffers            128 32k;
                 gzip_comp_level         6;
                 gzip_http_version       1.1;
                 gzip_proxied            expired no-cache no-store private auth;
                 gzip_types              text/plain text/css text/xml application/xml application/json text/javascript application/javascript application/x-javascript;
               
                root   /app/;
                try_files $uri $uri/ /index.html;
                index  index.html index.htm;
                if (-f $request_filename/index.html){
                        add_header Cache-Control  no-store;
                        rewrite (.*) $1/index.html break;
                }

                if ($request_uri ~* \.(htm|html)$) {
                        add_header  Cache-Control no-store;
                }
                if ($request_uri ~* \.(png|gif|jpg|ttf|svg|woff)$) {
                        expires 7d;
                }
                if ($request_uri ~* \.(css|js)$) {
                        expires 3d;
                }
        }
        location /iot-api/ {
            proxy_set_header   Host $host:$server_port;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass         http://iot-server:8089/;
		    client_max_body_size 100M;  # 设置最大上传文件大小为 10MB
        }
        location /oss/ {
            proxy_set_header   Host $host:$server_port;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass         http://minio:9000/;
		    client_max_body_size 100M;  # 设置最大上传文件大小为 10MB
        }
    

   }

