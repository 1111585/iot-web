#      - "${M7S_SIP:-5060}:5060/udp"
#      - "58200-59200:58200-59200"
#    volumes:
#      - ./volumes/m7s/logs:/monibuca/logs
#    environment:
#      TZ: "Asia/Shanghai"
#      LOCAL_IP: ${LOCAL_IP}
#    networks:
#      - iot-network
  web:
    build: '../site'
    restart: always
    container_name: web
    environment:
      TZ: "Asia/Shanghai"
    ports:
      - '${WEB_PORT:-80}:80'
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - iot-server
    networks:
      - iot-network
